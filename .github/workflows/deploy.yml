name: Build & Deploy Imperium Solutions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "a1915d92692b356df97"
    steps:
      - name: Checkout repository
        run: |
          git init -b main .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install dependencies & build production bundle
        run: |
          node --version
          npm install
          npm run build

      - name: Deploy to Cloudflare Pages (when CLOUDFLARE_API_TOKEN secret is set)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name imperium-solutions-simulator --branch main --commit-dirty=true --force
