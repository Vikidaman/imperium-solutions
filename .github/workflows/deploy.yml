name: Build & Deploy Imperium Solutions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "a1915d92692b35762bd4e2f4e356df97"
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install dependencies & build production bundle
        run: |
          node --version
          npm install
          npm run build

      - name: Deploy to Cloudflare Workers (when CLOUDFLARE_API_TOKEN secret is set)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
